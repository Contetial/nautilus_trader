# Zerodha API Credentials Configuration
# Copy this file to 'zerodha_credentials.toml' and fill in your actual credentials
# 
# IMPORTANT: Never commit the actual credentials file to version control!
# Add 'zerodha_credentials.toml' to your .gitignore

[api]
# Your Kite Connect API key (from https://kite.trade)
api_key = "7zks6tfai2vje1at"

# Your Kite Connect API secret
api_secret = "gt8hvnuiwtz7w8a3dwd8tcqnvguk31el" 

# Your access token (generated after login flow)
# Leave empty if you want to generate it programmatically
access_token = "I76VcmH33rx5vsRTU03C69XgFLCtbeST"

[settings]
# Trading mode: "live" or "paper"
trading_mode = "paper"

# Sandbox mode (true for testing, false for production)
sandbox = true

# Default product type for orders
default_product_type = "MIS"  # MIS, CNC, NRML

# Default validity for orders  
default_validity = "DAY"      # DAY, IOC, GTT

[paper_trading]
# Paper trading initial balance (in INR)
initial_balance = 1000000.0   # 10 Lakh INR

# Commission per trade (in INR)
commission_per_trade = 20.0

# Simulate execution delays (milliseconds)
execution_delay_ms = 100

# Enable market data simulation
simulate_market_data = true

[risk_management]
# Maximum order value (in INR)
max_order_value = 100000.0    # 1 Lakh INR

# Maximum position value (in INR) 
max_position_value = 1000000.0 # 10 Lakh INR

# Maximum number of orders per minute
max_orders_per_minute = 10

# Enable pre-trade validation
enable_validation = true

[logging]
# Log level: ERROR, WARN, INFO, DEBUG, TRACE
log_level = "INFO"

# Enable file logging
log_to_file = true

# Log file path (relative to project root)
log_file = "logs/zerodha_adapter.log"

[testing]
# Test duration for live tests (seconds)
test_duration = 300

# Test instruments (symbols to use for testing)
test_instruments = [
    "RELIANCE",
    "TCS", 
    "HDFCBANK",
    "INFY",
    "ICICIBANK"
]

# Maximum acceptable data quality percentage
min_data_quality = 85.0

# Maximum acceptable error rate percentage
max_error_rate = 5.0