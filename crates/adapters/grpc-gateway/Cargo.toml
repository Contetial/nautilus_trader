[package]
name = "nautilus-grpc-gateway"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "gRPC gateway for NautilusTrader Trading Terminal"

[lib]
name = "nautilus_grpc_gateway"
crate-type = ["rlib"]

[dependencies]
# Workspace dependencies - Zerodha adapter
nautilus-zerodha = { workspace = true }
nautilus-model = { workspace = true }
nautilus-core = { workspace = true }
nautilus-common = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-stream = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Decimal precision
rust_decimal = { workspace = true }
chrono = { workspace = true }

# Crypto for vault
aes-gcm = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }

# HTTP/JSON API layer
axum = { workspace = true, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# gRPC-Web support
tonic-web = "0.13"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[[bin]]
name = "trading-server"
path = "src/main.rs"
