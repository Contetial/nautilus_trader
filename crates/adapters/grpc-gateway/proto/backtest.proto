syntax = "proto3";

package nautilus.gateway.backtest;

// Backtest Service for running strategy backtests
service BacktestService {
  // Get historical bar data for backtesting
  rpc GetHistoricalData(GetHistoricalDataRequest) returns (GetHistoricalDataResponse);

  // Run a backtest with a strategy
  rpc RunBacktest(RunBacktestRequest) returns (stream BacktestProgress);

  // Get backtest results
  rpc GetBacktestResults(GetBacktestResultsRequest) returns (BacktestResultsResponse);

  // List saved backtest results
  rpc ListBacktests(ListBacktestsRequest) returns (ListBacktestsResponse);
}

// Historical data request
message GetHistoricalDataRequest {
  string broker_id = 1;
  string symbol = 2;
  string exchange = 3;
  string interval = 4;  // "minute", "5minute", "15minute", "hour", "day"
  string from_date = 5;  // ISO date string
  string to_date = 6;    // ISO date string
}

message GetHistoricalDataResponse {
  bool success = 1;
  string error = 2;
  repeated Bar bars = 3;
  int32 total_bars = 4;
}

message Bar {
  int64 timestamp = 1;  // Unix timestamp in milliseconds
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  int64 volume = 6;
}

// Backtest configuration
message RunBacktestRequest {
  string strategy_code = 1;
  string strategy_name = 2;

  // Data configuration
  string broker_id = 3;
  repeated string symbols = 4;
  string exchange = 5;
  string interval = 6;
  string from_date = 7;
  string to_date = 8;

  // Capital and sizing
  double initial_capital = 9;
  double position_size = 10;
  string position_size_type = 11;  // "fixed", "percent", "risk_percent"

  // Transaction costs
  double commission_rate = 12;
  double slippage_rate = 13;

  // Strategy parameters (JSON string)
  string strategy_params = 14;
}

message BacktestProgress {
  string status = 1;  // "initializing", "loading_data", "running", "completed", "error"
  int32 progress_percent = 2;
  string message = 3;

  // Partial results (updated during backtest)
  double current_equity = 4;
  int32 trades_completed = 5;

  // Final results (only when completed)
  BacktestResults results = 6;
}

message BacktestResults {
  string backtest_id = 1;
  string strategy_name = 2;
  int64 start_time = 3;
  int64 end_time = 4;

  // Performance metrics
  double total_return = 5;
  double total_return_percent = 6;
  double annualized_return = 7;
  double sharpe_ratio = 8;
  double sortino_ratio = 9;
  double max_drawdown = 10;
  double max_drawdown_percent = 11;
  double win_rate = 12;
  double profit_factor = 13;
  double avg_win = 14;
  double avg_loss = 15;
  int32 total_trades = 16;
  int32 winning_trades = 17;
  int32 losing_trades = 18;

  // Equity curve data
  repeated EquityPoint equity_curve = 19;

  // Trade list
  repeated Trade trades = 20;

  // Signals for chart
  repeated Signal signals = 21;
}

message EquityPoint {
  int64 timestamp = 1;
  double equity = 2;
  double drawdown = 3;
}

message Trade {
  string trade_id = 1;
  string symbol = 2;
  string side = 3;  // "BUY" or "SELL"
  int64 entry_time = 4;
  int64 exit_time = 5;
  double entry_price = 6;
  double exit_price = 7;
  int32 quantity = 8;
  double pnl = 9;
  double pnl_percent = 10;
  double commission = 11;
  string exit_reason = 12;  // "signal", "stop_loss", "take_profit"
}

message Signal {
  int64 timestamp = 1;
  string symbol = 2;
  string type = 3;  // "BUY", "SELL", "STOP_LOSS", "TAKE_PROFIT"
  double price = 4;
  string reason = 5;
}

// Get specific backtest results
message GetBacktestResultsRequest {
  string backtest_id = 1;
}

message BacktestResultsResponse {
  bool success = 1;
  string error = 2;
  BacktestResults results = 3;
}

// List backtests
message ListBacktestsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListBacktestsResponse {
  repeated BacktestSummary backtests = 1;
  int32 total = 2;
}

message BacktestSummary {
  string backtest_id = 1;
  string strategy_name = 2;
  int64 created_at = 3;
  double total_return_percent = 4;
  double sharpe_ratio = 5;
  int32 total_trades = 6;
}
