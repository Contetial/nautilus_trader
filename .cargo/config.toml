[target.'cfg(all())']
rustflags = [
    # https://rust-lang.github.io/rust-clippy/master/index.html#drop_non_drop
    # Disable this lint as we explicitly drop even when `Drop` is not implemented
    "-Aclippy::drop_non_drop",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
]

[env]
# Add cmake and NASM to PATH for aws-lc-sys on Windows
CMAKE = "C:\\Program Files\\CMake\\bin\\cmake.exe"
AWS_LC_SYS_CMAKE = "C:\\Program Files\\CMake\\bin\\cmake.exe"
AWS_LC_SYS_PREBUILT_NASM = "C:\\Program Files\\NASM\\nasm.exe"
# Protobuf compiler for prost-build
PROTOC = "D:\\Nautilus-Trader\\protoc\\bin\\protoc.exe"
